<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>4UPR Creator CRM</title><style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
 /* ===== 皮肤 A · 素白（v152）=====
    换肤只改这一段变量，HTML 结构 / 类名 / 逻辑 / 数据全部不动 */
 --bg:#ffffff;--card:#ffffff;--ink:#14161c;--ink2:#4b5262;--mut:#6c7382;
 --line:#e8eaef;--line2:#dfe2e9;
 --acc:#3730c9;--acc-ink:#3730c9;--acc-soft:#eeedfb;
 --ok:#177a4c;--oks:#e6f6ed;--warn:#9a6510;--warns:#fdf1dd;--bad:#b23a33;--bads:#fdeaea;--vio:#5b3bb5;--vios:#eeeafa;
 --r:10px;--r2:8px;--r3:6px;
 --sh:none;
 --sh2:0 12px 34px -20px rgba(20,24,40,.30);
 /* 侧栏（素白＝浅色侧栏） */
 --sidebg:#fbfbfd;--sideline:#e8eaef;--sideink:#4b5262;--sidemut:#8b93a1;
 --sideon:#14161c;--sideonbg:#eeedfb;--sidehov:#f1f2f6;
 --sidecnt:#e9ebf0;--sidecntink:#5b6472;--sidelogo:#3730c9;
 --sidesh:14px 0 34px rgba(20,24,40,.10);--sidebar:#cfd4e0;
}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:13.5px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;line-height:1.55;letter-spacing:-.1px}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#cfd4e0;border-radius:8px}::-webkit-scrollbar-thumb:hover{background:#bcc3d3}
.app{display:flex;min-height:100vh;padding-left:64px}
/* ===== sidebar（颜色全部走变量，换肤只改 :root）===== */
.side{width:64px;background:var(--sidebg);color:var(--sideink);flex-shrink:0;padding:14px 0 18px;position:fixed;left:0;top:0;height:100vh;overflow:hidden;border-right:1px solid var(--sideline);z-index:40;
 transition:width .3s cubic-bezier(.16,1,.3,1)}
.side:hover{width:236px;overflow-y:auto;box-shadow:var(--sidesh)}
.side::-webkit-scrollbar{width:6px}.side::-webkit-scrollbar-thumb{background:var(--sidebar);border-radius:6px}
.navsl{position:absolute;left:6px;right:6px;height:36px;border-radius:var(--r2);pointer-events:none;opacity:0;
 background:var(--sideonbg);
 border:1px solid var(--acc-soft);
 transition:top .32s cubic-bezier(.16,1,.3,1),opacity .2s}
.navsl::before{content:"";position:absolute;left:-6px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--acc)}
.brandlogo{padding:0 0 14px;margin:0 0 6px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--sideline);white-space:nowrap;overflow:hidden}
.brandlogo .lgmark{width:26px;height:26px;flex:0 0 26px;margin-left:19px;border-radius:8px;background:var(--sidelogo);display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;letter-spacing:-.4px}
.brandlogo .lgtxt{font-weight:700;font-size:15px;color:var(--sideon);letter-spacing:.2px;opacity:0;transition:opacity .16s}
.brandlogo .lgtxt small{display:block;font-size:8.5px;letter-spacing:1.6px;color:var(--sidemut);font-weight:700;margin-top:1px}
.side:hover .brandlogo .lgtxt{opacity:1;transition-delay:.08s}
.navgrp{font-size:9.5px;text-transform:uppercase;letter-spacing:1.4px;color:var(--sidemut);padding:0 17px;font-weight:700;white-space:nowrap;opacity:0;height:0;overflow:hidden;transition:opacity .16s,height .22s,padding .22s}
.side:hover .navgrp{opacity:1;height:26px;padding:16px 17px 6px}
.nav{position:relative;z-index:1;display:flex;align-items:center;gap:11px;height:36px;padding:0 11px;margin:2px 6px;cursor:pointer;font-size:13px;color:var(--sideink);border-radius:var(--r2);white-space:nowrap;transition:color .14s,background .14s}
.nav .ic{width:18px;flex:0 0 18px;text-align:center;font-size:14px;opacity:.92}
.nav .lb{flex:1;min-width:0;overflow:hidden;opacity:0;transform:translateX(-6px);transition:opacity .16s,transform .22s}
.side:hover .nav .lb{opacity:1;transform:none}
.nav:hover{background:var(--sidehov);color:var(--sideon)}
.nav.on{color:var(--sideon);font-weight:600}
.nav .cnt{opacity:0;transition:opacity .16s}.side:hover .cnt{opacity:1}
.navdot{position:absolute;left:31px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--sidebg);transition:opacity .16s}
.side:hover .navdot{opacity:0}
.cnt{margin-left:auto;font-size:10.5px;font-weight:700;background:var(--sidecnt);color:var(--sidecntink);padding:1px 8px;border-radius:20px;min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.nav.on .cnt{background:var(--acc);color:#fff}
.nav .cnt.hot{background:var(--bad);color:#fff}
/* ===== main ===== */
.main{flex:1;min-width:0}
.top{background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);padding:11px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.chip{padding:5px 13px;border-radius:8px;background:#fff;color:#59616e;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--line);transition:border-color .13s,background .13s}
.chip:hover{border-color:#cfd4dc}
.chip.on{background:var(--acc-soft);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
.who select{padding:7px 12px;border-radius:8px;border:1px solid var(--line2);font-size:12.5px;cursor:pointer;background:#fff;color:var(--ink);font-weight:600}
.who select:hover{border-color:var(--acc)}
.content{padding:22px 26px}
.hi{font-size:20px;font-weight:700;letter-spacing:-.2px;margin-bottom:2px}
.hi small{font-size:12.5px;color:var(--mut);font-weight:500;display:block;margin-top:4px}
/* ===== kpi (flat) ===== */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:16px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;position:relative;overflow:hidden;box-shadow:none;transition:border-color .15s}
.kpi:hover{border-color:var(--line2)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc);opacity:.85;border-radius:0 3px 3px 0}
.kpi .n{font-size:24px;font-weight:700;letter-spacing:-.4px}
.kpi .l{font-size:11.5px;color:var(--mut);margin-top:4px;font-weight:500}
.blue{color:var(--acc)}.green{color:var(--ok)}.amber{color:var(--warn)}.pink{color:#c0356b}.purple{color:var(--vio)}
/* ===== card (flat, border not shadow) ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:14px;box-shadow:none}
.card h3{font-size:14px;font-weight:650;margin-bottom:4px;display:flex;align-items:center;gap:8px;letter-spacing:-.1px}
.card h3 .tag{font-size:10.5px;font-weight:600;color:var(--ink2);background:#f0f1f6;padding:2px 9px;border-radius:6px}
.card .sub{font-size:12px;color:var(--mut);margin-bottom:13px;line-height:1.6}
/* ===== table (flat) ===== */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{white-space:nowrap;text-align:left;color:var(--mut);font-weight:500;padding:10px 11px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:0;text-transform:none;position:sticky;top:0;background:#fff;z-index:3}
td{padding:11px 11px;border-bottom:1px solid #f1f2f5;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .1s}
tr:hover td{background:#f7f8fc}
/* brand pills (flat) */
.b-chip{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:#eef0f5;color:#5a6478;white-space:nowrap;display:inline-block}
.b-Molly{background:#fbe9f1;color:#c42d74}.b-Blacklyte{background:#e9eafb;color:#4f46e5}.b-Lisa{background:#e2f5ec;color:#12805c}
/* status pills (flat) */
.st{font-size:10.5px;padding:3px 9px;border-radius:6px;font-weight:600;white-space:nowrap;display:inline-block}
.s-p{background:var(--vios);color:var(--vio)}.s-g{background:var(--oks);color:var(--ok)}.s-r{background:var(--bads);color:var(--bad)}.s-a{background:var(--warns);color:var(--warn)}
.rv{font-size:10.5px;padding:2px 9px;border-radius:6px;font-weight:700;white-space:nowrap;display:inline-block}
.rv-待审{background:#eef0f5;color:#79839a}.rv-Pass{background:var(--bads);color:var(--bad)}.rv-可跟进{background:var(--oks);color:var(--ok)}.rv-重点跟进{background:#d3f0e0;color:#0c6b48}.rv-待定{background:var(--warns);color:var(--warn)}
/* buttons (flat) */
.btn{font-size:11.5px;padding:5px 12px;border-radius:8px;border:1px solid var(--line2);background:#fff;cursor:pointer;color:var(--acc-ink);font-weight:600;margin:1px;transition:all .13s;white-space:nowrap}
.btn:hover{background:#f7f8fb;border-color:#cfd4dc;box-shadow:none}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600;padding:7px 16px}
.btn.pri:hover{background:#4360e6;border-color:#4360e6;box-shadow:none}
.note{color:var(--mut);font-size:11.5px;max-width:290px;line-height:1.55}
.bar{height:8px;border-radius:6px;background:#eceef4;overflow:hidden;margin-top:6px}.bar>i{display:block;height:100%;background:var(--acc);border-radius:6px}
.mut{color:var(--mut);font-size:11.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
/* funnel (flat) */
.funnel{display:flex;gap:9px;overflow-x:auto;padding-bottom:4px}
.fstep{flex:1;min-width:100px;background:#fafbfc;border:1px solid var(--line);border-radius:11px;padding:14px 13px;text-align:center;transition:border-color .13s}
.fstep:hover{border-color:var(--line2)}
.fstep .fn{font-size:21px;font-weight:700;color:var(--acc);letter-spacing:-.3px}.fstep .fl{font-size:11.5px;color:var(--ink2);margin-top:3px;font-weight:600}.fstep .fc{font-size:10px;color:var(--mut);margin-top:4px}
/* banner (flat) */
.banner{background:var(--acc-soft);border:1px solid #dfe4fb;border-radius:9px;padding:11px 15px;font-size:12px;color:#3f57d6;margin-bottom:14px;line-height:1.6}
/* filter (flat) */
.filterbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px;align-items:center}
.filterbar .fl{font-size:11.5px;color:var(--mut);margin-right:3px;font-weight:600}
.fchip{padding:4px 12px;border-radius:8px;background:#fff;color:#59616e;font-size:11.5px;cursor:pointer;border:1px solid var(--line);font-weight:500;transition:border-color .13s,background .13s}
.fchip:hover{border-color:#cfd4dc}
.fchip.on{background:var(--acc-soft);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
/* criteria form */
.crit{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.crow{margin-bottom:12px}.crow>label{font-size:11.5px;color:var(--ink2);font-weight:600;display:block;margin-bottom:6px}
.tog{display:inline-flex;gap:6px;flex-wrap:wrap}
.tog span{padding:6px 13px;border-radius:7px;border:1px solid var(--line2);font-size:12px;cursor:pointer;color:#5a6478;transition:background .13s,color .13s}
.tog span:hover{border-color:var(--acc)}
.tog span.on{background:var(--acc-soft);color:var(--acc-ink);border-color:var(--acc)}
.tog span.ex.on{background:var(--bads);color:var(--bad);border-color:var(--bad)}
.kw{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.kwchip{background:var(--acc-soft);color:var(--acc-ink);padding:4px 10px;border-radius:6px;font-size:12px;display:inline-flex;gap:6px;align-items:center;font-weight:500}
.kwchip.seed{background:var(--oks);color:var(--ok)}.kwchip b{cursor:pointer;opacity:.55}.kwchip b:hover{opacity:1}
.kw input{border:1px solid var(--line2);border-radius:7px;padding:6px 10px;font-size:12px;width:130px}
.inp{border:1px solid var(--line2);border-radius:7px;padding:7px 10px;font-size:12.5px;width:82px;background:#fff;color:var(--ink);transition:border-color .13s}
.inp:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.fcards{display:flex;flex-direction:column;gap:13px}
.fcard{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:15px 17px}
.fchead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:11px;border-bottom:1px solid var(--line);margin-bottom:12px;font-size:14px}
.fchead .who2{margin-left:auto;color:var(--mut);font-size:12px}
.fcgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 18px}
.fcgrid .f{font-size:12.5px}
.fcgrid .f>label{display:block;color:var(--mut);font-size:10.5px;margin-bottom:4px}
.fcgrid .wide{grid-column:span 2}
.fcfollow{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fcfollow>label{color:var(--mut);font-size:11px}
details>summary{list-style:none}details>summary::-webkit-details-marker{display:none}
a{text-decoration:none}
.dp-day.dpfut{color:#cfd4e0;cursor:not-allowed;background:transparent}
.dp-pop{position:absolute;top:calc(100% + 6px);right:14px;z-index:60;background:#fff;border:1px solid var(--line2);border-radius:10px;box-shadow:0 16px 40px -10px rgba(20,24,40,.28);width:600px;overflow:hidden}
.dp-body{display:flex}
.dp-side{width:210px;border-right:1px solid var(--line);padding:8px;flex-shrink:0}
.dp-preset{padding:8px 10px;border-radius:8px;cursor:pointer;transition:background .12s}
.dp-preset:hover{background:#f4f5fa}
.dp-preset.on{background:var(--acc-soft)}
.dp-preset .r{font-size:11px;color:var(--mut);margin-top:2px}
.dp-cal{flex:1;padding:12px 14px}
.dp-calhd{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:13.5px;margin-bottom:8px}
.dp-nav{cursor:pointer;padding:2px 9px;border-radius:6px;font-size:16px;color:var(--ink2)}.dp-nav:hover{background:#f0f1f6}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dp-wd{font-size:10.5px;color:var(--mut);padding:4px 0;font-weight:600}
.dp-day{padding:7px 0;font-size:12.5px;border-radius:7px;cursor:pointer}
.dp-day:hover{background:#eef0ff}
.dp-day.in{background:#e6e8fb}
.dp-day.sel{background:var(--acc);color:#fff;font-weight:700}
.dp-day.empty{visibility:hidden;cursor:default}
.dp-foot{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);font-size:12px}
/* ===== 提报·审核台 v115（目录式 + 回复原文展开） ===== */
.adwrap{overflow-x:auto;max-height:70vh;overflow-y:auto;border-top:1px solid var(--line)}
.adtb{border-collapse:separate;border-spacing:0;font-size:12.5px;width:100%;min-width:1300px;table-layout:fixed}
.adtb th{white-space:nowrap;text-align:left;color:var(--mut);font-weight:600;padding:11px;font-size:11px;background:#fbfbfd;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
.adtb td{padding:13px 11px;border-bottom:1px solid #f2f3f7;vertical-align:top;background:#fff}
.adtb tr.adrow:hover td{background:#f9fafd}
.adtb tr.adrow.open td{background:#f7f9ff}
.adtb th.fl,.adtb td.fl{position:sticky;left:0;z-index:6;box-shadow:1px 0 0 var(--line)}
.adtb th.fl{z-index:8}
.adtb tr.adrow:hover td.fl{background:#f9fafd}.adtb tr.adrow.open td.fl{background:#f7f9ff}
.adtb th.fr,.adtb td.fr{position:sticky;right:0;z-index:6;box-shadow:-1px 0 0 var(--line)}
.adtb th.fr{z-index:8;text-align:center}
col.a-hd{width:158px}col.a-pl{width:68px}col.a-fs{width:78px}col.a-ow{width:96px}col.a-dt{width:72px}
col.a-pr{width:74px}col.a-st{width:70px}col.a-wy{width:120px}col.a-rp{width:auto}col.a-sp{width:86px}
col.a-kk{width:104px}col.a-rv{width:192px}col.a-cp{width:88px}col.a-dl{width:170px}col.a-av{width:96px}col.a-dt{width:92px}col.a-rp{min-width:280px}
.aufi{display:inline-block;margin-left:5px;padding:0 4px;border-radius:4px;color:#a8adbb;cursor:pointer;font-size:10px;line-height:16px;border:1px solid transparent}
.aufi:hover{background:#eceafd;color:#4f46e5;border-color:#d9d7f7}
.aufi.on{background:#4f46e5;color:#fff;border-color:#4f46e5}
#aupop{position:fixed;z-index:9999;background:#fff;border:1px solid #e0e1ea;border-radius:9px;box-shadow:0 10px 32px rgba(20,22,28,.16);padding:9px;min-width:186px;max-width:260px}
#aupop .aupt{font-size:11px;font-weight:700;color:#8b8fa3;padding:2px 6px 7px}
#aupop .aupl{max-height:260px;overflow:auto}
#aupop .aupo{display:block;padding:6px 9px;border-radius:6px;font-size:12.5px;color:#1f2733;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#aupop .aupo:hover{background:#f3f3fa}
#aupop .aupo.on{background:#4f46e5;color:#fff;font-weight:700}
#aupop .aupi{width:100%;padding:6px 9px;border:1px solid #dcdde6;border-radius:6px;font-size:12.5px;outline:none}
#aupop .aupi:focus{border-color:#4f46e5}
#aupop .aupb{display:flex;gap:6px;margin-top:7px}
#aupop .aupb button{flex:1;padding:5px 0;font-size:12px}
.adtb thead tr:first-child th{white-space:nowrap}
.ad-cp-in{width:74px;text-align:right;font-weight:600}
.ad-dl-in{width:100%;min-height:52px;font-family:inherit;line-height:1.5;resize:vertical;padding:5px 7px}
.adtb td .ad-why{max-height:52px;overflow:hidden}
.ad-hd{font-size:13px;font-weight:700;color:var(--acc-ink);text-decoration:none;letter-spacing:-.2px;display:block}
.ad-hd:hover{text-decoration:underline}
.ad-sub{font-size:10.5px;color:var(--mut);margin-top:3px}
.ad-pl{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;display:inline-block}
.ad-IG{background:#fbe9f1;color:#c42d74}.ad-TT{background:#eceef3;color:#4b5262}.ad-YTB{background:#fdecec;color:#c0352f}
.ad-num{font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.ad-dt{white-space:nowrap;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.ad-dt small{display:block;color:var(--mut);font-size:10.5px;margin-top:2px}
.ad-pr{font-weight:800;color:#0d7a52;font-size:13.5px;letter-spacing:-.3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ad-pr small{font-weight:600;font-size:10px;color:var(--mut);display:block;margin-top:2px}
.ad-dash{color:#c9ced9}
.ad-why{font-size:11.5px;color:var(--ink2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ad-rp{cursor:pointer}
.ad-it{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:5px;display:inline-block;margin-bottom:5px}
.it-quote{background:#e4f4ea;color:#0c6b48}.it-yes{background:var(--acc-soft);color:var(--acc-ink)}
.it-ask{background:var(--warns);color:var(--warn)}.it-gift{background:var(--vios);color:var(--vio)}
.it-non{background:#eef0f5;color:#79839a}.it-man{background:#f3f4f8;color:#98a0b0}
.ad-tx{font-size:11.5px;color:var(--ink2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ad-ex{font-size:10.5px;color:var(--acc-ink);font-weight:600;margin-top:4px;display:inline-block}
.ad-rp:hover .ad-ex{text-decoration:underline}
.adtb tr.addet td{background:#f7f9ff;border-bottom:1px solid var(--line);padding:0}
.addin{padding:15px 18px 17px;display:grid;grid-template-columns:minmax(0,1fr) 262px;gap:18px;align-items:start;position:sticky;left:0;width:min(1240px,calc(100vw - 300px))}
.adq{background:#fff;border:1px solid #e5eafb;border-left:3px solid #a9bcf7;border-radius:10px;padding:14px 16px}

// ===== 线索池 一键提报 =====
function ldStChip(st){st=String(st||'');var c=(st==='已回复')?'s-g':((st==='待发送'||st==='已发送')?'s-a':'');
 return '<span class="st '+c+'" style="white-space:nowrap">'+(st||'—')+'</span>';}
function ldRepOK(r){return !!(r&&(r.status==='已回复'||r.replied==='是'));}
function ldSrcKind(r){var k=String((r&&r.hit_keywords)||'').trim();
 if(!k)return '';
 if(/^手动导入/.test(k))return '手动导入';
 if(/^种子[:：]/.test(k))return '竞品种子';
 return 'AI抓取';}
function ldSrcCell(r){var k=String((r&&r.hit_keywords)||'').trim();var kind=ldSrcKind(r);
 if(kind==='手动导入')return '<span class="st" style="background:#eef1fe;color:#3f57d6">手动导入</span>';
 if(kind==='竞品种子')return '<span class="st" style="background:#fdf1e7;color:#b5721a" title="'+auEsc(k)+'">'+auEsc(k.replace(/^种子[:：]/,'种子 '))+'</span>';
 if(kind==='AI抓取')return '<span class="mut" title="命中的关键词：'+auEsc(k)+'">'+auEsc(k.replace(/^词[:：]/,''))+'</span>';
 return '<span class="mut">—</span>';}
function ldSelOK(r){
 if(!r||r.reported_at)return false;
 if(r.status==='已发送'||r.status==='已回复'||r.status==='待发送'||r.status==='重复')return false;
 if(!r.owner)return true;
 return !!(typeof meOwner!=='undefined'&&meOwner&&ownEq(r.owner,meOwner));}
function ldSelSet(){return (window.__ldSel=window.__ldSel||{});}
function ldSelN(){var m=ldSelSet(),n=0;for(var k in m)if(m[k])n++;return n;}
function ldCk(id,el){var m=ldSelSet();if(el.checked)m[id]=1;else delete m[id];ldSelBar();}
function ldCkAll(el){var m=ldSelSet();
 document.querySelectorAll('.ldck').forEach(function(c){c.checked=el.checked;var i=+c.getAttribute('data-id');if(el.checked)m[i]=1;else delete m[i];});
 ldSelBar();}
function ldSelClear(){window.__ldSel={};document.querySelectorAll('.ldck').forEach(function(c){c.checked=false;});var a=document.getElementById('ldCkAll');if(a)a.checked=false;ldSelBar();}
function ldWhoOpts(){var list=(D.personas||[]).slice();
 var me=(typeof meOwner!=='undefined'&&meOwner)?meOwner:'';
 if(me&&list.map(ownNm).indexOf(ownNm(me))<0)list.unshift(me);
 return list;}
function ldSelWho(){var w=window.__ldSelWho;
 if(w)return w;
 var me=(typeof meOwner!=='undefined'&&meOwner)?meOwner:'';
 if(me)return me;
 var l=ldWhoOpts();return l.length?l[0]:'';}
function ldSelWhoSet(v){window.__ldSelWho=v;try{ldSelBar();}catch(e){}}
function ldSelBar(){var el=document.getElementById('ldSelBar');if(!el)return;
 var n=ldSelN();var mgr=(typeof orMgr==='function')&&orMgr();
 var who=ldSelWho();
 var sig=n+'|'+(mgr?'m':'p')+'|'+who;
 if(el.__ldsig===sig)return; el.__ldsig=sig;
 var pick=mgr?('<span class="mut" style="margin-left:12px">认领给 </span><select onchange="ldSelWhoSet(this.value)" style="padding:4px 8px;border:1px solid #d4d8e3;border-radius:7px;font-size:12.5px;background:#fff">'
   +ldWhoOpts().map(function(x){return '<option value="'+auEsc(x)+'"'+(ownNm(x)===ownNm(who)?' selected':'')+'>'+x+'</option>';}).join('')
   +'</select>'):('<span class="mut" style="margin-left:12px">认领给 <b>'+(who||'—')+'</b></span>');
 el.innerHTML=n?('<span style="font-weight:700">已选 '+n+' 条</span>'+pick
  +'<button class="btn pri" style="margin-left:10px;padding:5px 14px" onclick="ldSelGo()">✅ 认领并加入外联台（待发送）</button>'
  +'<button class="btn" style="margin-left:6px;padding:5px 12px" onclick="ldSelClear()">取消选择</button>')
  :('<span class="mut">勾选左边的方框，可以一次把多条线索认领给某个推广并加入外联台待发送</span>'+(mgr?pick:''));}
function ldSelGo(){
 var who=ldSelWho();
 if(!who){toast('请先在上面的「认领给」里选一个推广');return;}
 if(!window.__sb){toast('未连接数据库');return;}
 var m=ldSelSet();var ids=[];for(var k in m)if(m[k])ids.push(+k);
 if(!ids.length){toast('还没勾选任何线索');return;}
 var st=ldSt(brand);var mp={};(st.rows||[]).forEach(function(x){mp[x.id]=x;});
 var toSend=[],toPool=[];
 ids.forEach(function(id){var L=mp[id];if(!L)return;
  if(orMailOk(L.email))toSend.push(id);else toPool.push(id);});
 if(!toSend.length&&!toPool.length){toast('没有可操作的线索');return;}
 if(!confirm('把选中的 '+(toSend.length+toPool.length)+' 条认领到「'+who+'」名下？\n'
  +(toSend.length?('· '+toSend.length+' 条有邮箱 → 进「待发送」，今晚按你的发信配额自动发出\n'):'')
  +(toPool.length?('· '+toPool.length+' 条缺邮箱 → 只认领，补完邮箱才会发\n'):'')))return;
 var jobs=[],done=0,err='';
 if(toSend.length)jobs.push(window.__sb.from('leads').update({owner:who,status:'待发送'}).in('id',toSend));
 if(toPool.length)jobs.push(window.__sb.from('leads').update({owner:who}).in('id',toPool));
 jobs.forEach(function(pr){pr.then(function(res){done++;if(res.error)err=res.error.message;
  if(done===jobs.length){
   if(err)toast('⚠️ 操作失败：'+err);
   else toast('✅ 已认领 '+ids.length+' 条'+(toSend.length?('，其中 '+toSend.length+' 条已进待发送'):''));
   window.__ldSel={};ldRefresh();}});});}
function ldWho(){try{var w=ldSelWho();if(w)return w;}catch(e){}return (typeof meOwner!=='undefined'&&meOwner)?meOwner:'';}
function ldCanClaim(r){return !!r&&!r.owner&&!r.reported_at;}
function ldClaimRun(ids){
 var who=ldWho();
 if(!who){toast('请先在右上角把身份切到具体的推广，再认领');return;}
 if(!window.__sb){toast('未连接数据库');return;}
 var st=ldSt(brand);var rows=(st.rows||[]);
 var mp={};rows.forEach(function(x){mp[x.id]=x;});
 var toSend=[],toPool=[];
 ids.forEach(function(id){var L=mp[id];if(!L)return;
  if(orMailOk(L.email)&&L.status!=='已发送'&&L.status!=='已回复')toSend.push(id);else toPool.push(id);});
 var jobs=[],done=0,err='';
 if(toSend.length)jobs.push(window.__sb.from('leads').update({owner:who,status:'待发送'}).in('id',toSend));
 if(toPool.length)jobs.push(window.__sb.from('leads').update({owner:who}).in('id',toPool));
 if(!jobs.length){toast('没有可认领的线索');return;}
 jobs.forEach(function(pr){pr.then(function(res){done++;if(res.error)err=res.error.message;
  if(done===jobs.length){
   if(err)toast('⚠️ 认领失败：'+err);
   else toast('✅ 已认领 '+ids.length+' 条到「'+who+'」'+(toSend.length?('，其中 '+toSend.length+' 条已进待发送'):'')+(toPool.length?('，'+toPool.length+' 条还缺邮箱'):''));
   ldRefresh();}});});}
function ldClaim(id){ldClaimRun([id]);}
function ldClaimBatch(){
 var arr=(window.__ldClaimable||[]);
 if(!arr.length){toast('本页没有可认领的公共池线索');return;}
 var n=Math.min(arr.length,50);
 if(!confirm('把当前筛选结果里前 '+n+' 条公共池线索认领到「'+(ldWho()||'（未选身份）')+'」名下？\n有邮箱的会直接进「待发送」，今晚按你的发信配额自动发出。'))return;
 ldClaimRun(arr.slice(0,n));}
function ldActCell(r){
 if(r.reported_at)return '<span class="st s-g" title="已提报给主管审核">已提报</span>';
 if(ldCanClaim(r))return '<button class="btn pri" style="padding:4px 12px" onclick="ldClaim('+r.id+')" title="认领后这条线索归你，有邮箱的今晚自动发开发信">＋ 认领</button>';
 if(ldRepOK(r))return '<button class="btn pri" onclick="ldReport('+r.id+')" title="网红已回复，可提报给主管审核">📝 提报</button>';
 if(r.status==='已发送')return '<span class="mut" title="开发信已发出，等网红回复后才能提报">已发送·待回复</span>';
 if(r.status==='待发送')return '<span class="mut" title="已加入待发送，今晚自动发信；发出且网红回复后才能提报">待发送</span>';
 return '<span class="mut" title="规则：必须先在外联台把开发信发出去、并且网红回复了，才能提报">未外联</span>';
}
function ldReport(leadId){
 if(!window.__sb){toast('未连接数据库');return;}
 var st=ldSt(brand);var L=(st.rows||[]).find(function(x){return x.id===leadId;})||((window.__orRows||{})[leadId]);
 if(!L){toast('找不到这条线索');return;}
 var plat=auPlat(L.platform);
 var dup=D.audit.concat(D.nego||[],D.fulfil||[]).find(function(x){return nkey(x.handle)+'|'+auPlat(x.platform)===nkey(L.handle)+'|'+plat});
 if(dup&&!confirm('「'+L.handle+'」库里已有一条记录（'+(dup.review||'进行中')+'）。\n仍要新建提报吗？'))return;
 var facts=[];
 if(L.followers)facts.push('粉丝 '+fmtK(L.followers));
 if(L.avg_views)facts.push('均播 '+Number(L.avg_views).toLocaleString('en-US'));
 if(L.email)facts.push(orMailOk(L.email)?'有邮箱':'待补邮箱');
 var why=window.prompt('提报「'+L.handle+'」给主管审核\n\n推荐理由（主管靠这个判断，可直接回车用默认）：',(L.intent_summary||facts.join(' · ')||'线索池提报'));
 if(why===null)return;
 var cost=window.prompt('底价$（网红报价 / 你能给的预算，可留空）：',(L.quote_amount||L.quote||''));
 if(cost===null)return;
 cost=String(cost).replace(/[^0-9.]/g,'');
 var it=L.intent||rfIntent(L.reply_text||'');
 var rec={brand:L.brand||brand,platform:plat,handle:L.handle,profile_url:L.profile_url||null,
  followers:Number(L.followers)||null,avg_views:Number(L.avg_views)||null,country:L.country||null,
  owner:L.owner||((typeof meOwner!=='undefined'&&meOwner)?meOwner:null),
  stage:'提报',review:null,submit_date:rfToday(),notes:String(why||'').trim()||'线索池提报',
  influencer_cost:cost?Number(cost):null,sample_action:'赠送',gift_return:'产品赠送',
  reply_text:L.reply_text||null,intent:it||null,intent_ai:L.intent_ai||null,lead_id:L.id,source:'线索池提报'};
 window.__sb.from('collaborations').insert(rec).select().then(function(res){
  if(res.error){toast('⚠️ 提报失败：'+res.error.message);return;}
  var row=(res.data&&res.data[0])||{};
  window.__sb.from('leads').update({reported_at:new Date().toISOString()}).eq('id',L.id).then(function(){});
  D.audit.unshift({_id:row.id,brand:rec.brand,handle:rec.handle,profile_url:rec.profile_url,platform:rec.platform,followers:rec.followers,avg_views:rec.avg_views,country:rec.country,owner:rec.owner,influencer_cost:rec.influencer_cost,review:'待审',notes:rec.notes,submit_date:rec.submit_date,reply_text:rec.reply_text||'',intent:rec.intent||'',intent_ai:rec.intent_ai||'',lead_id:L.id,kk_note:'',sample_action:'赠送',deliverables:'',created_at:''});
  L.reported_at=new Date().toISOString();
  toast('「'+rec.handle+'」已提报 → 主管待审');render();
 }).catch(function(e){toast('⚠️ 提报失败：'+e.message);});
}
function rfToday(){var b=new Date(Date.now()+8*3600e3);return b.toISOString().slice(0,10)}
function rfIntent(t){
 t=String(t||'').toLowerCase();if(!t.trim())return '';
 if(/\b(not interested|no thank|unfortunately we|decline|unsubscribe)\b/.test(t))return 'non';
 if(/(\$\s?\d|usd\s?\d|\d+\s?(usd|dollars)|my rate|rate card|per (reel|post|video)|charge)/.test(t))return 'quote';
 if(/(gift|gifted|send (me|one|it) over|free product|sample)/.test(t))return 'gift';
 if(/(\?|which|what|how|could you|can you|more (info|details))/.test(t))return 'ask';
 return 'yes';
}
function rfQuote(t){var m=String(t||'').match(/\$\s?([0-9][0-9,]{1,6})(?:\.\d+)?/);if(!m)return null;var n=Number(m[1].replace(/,/g,''));return isNaN(n)?null:n}
function rfSubmit(){
 if(!window.__sb){toast('未连接数据库');return;}
 var g=function(id){var e=document.getElementById(id);return e?String(e.value||'').trim():''};
 var handle=g('rfHandle'),fans=g('rfFans'),why=g('rfWhy');
 var msg=document.getElementById('rfMsg');
 if(!handle){msg.innerHTML='<b style="color:var(--bad)">请填创作者ID</b>';return;}
 if(!fans){msg.innerHTML='<b style="color:var(--bad)">请填粉丝数</b>';return;}
 if(!why){msg.innerHTML='<b style="color:var(--bad)">请填推荐理由（主管靠这个判断）</b>';return;}
 var plat=g('rfPlat'),bnd=g('rfBrand'),reply=g('rfReply');
 var key=nkey(handle)+'|'+plat;
 var dup=D.audit.concat(D.nego||[],D.fulfil||[]).find(function(x){return nkey(x.handle)+'|'+auPlat(x.platform)===nkey(handle)+'|'+plat});
 if(dup&&!confirm('「'+handle+'」在库里已经有一条记录（'+(dup.review||'进行中')+'）。\n仍要新建一条提报吗？')){return;}
 var cost=g('rfCost').replace(/[^0-9.]/g,'');
 var it=rfIntent(reply);
 var rec={brand:bnd,platform:plat,handle:handle,profile_url:g('rfUrl')||null,followers:Number(fans.replace(/[^0-9]/g,''))||null,
  avg_views:Number(g('rfViews').replace(/[^0-9]/g,''))||null,country:g('rfCountry')||null,owner:(typeof meOwner!=='undefined'&&meOwner)?meOwner:null,
  stage:'提报',review:null,submit_date:rfToday(),notes:why,deliverables:g('rfDeliv')||null,
  influencer_cost:cost?Number(cost):null,sample_action:g('rfSample'),gift_return:(g('rfSample')==='退回'?'产品退回':'产品赠送'),
  reply_text:reply||null,intent:it||null,intent_ai:null,source:'手动提报'};
 var btn=document.getElementById('rfBtn');btn.disabled=true;msg.innerHTML='<span class="mut">提交中…</span>';
 window.__sb.from('collaborations').insert(rec).select().then(function(res){
  btn.disabled=false;
  if(res.error){msg.innerHTML='<b style="color:var(--bad)">提交失败：'+res.error.message+'</b>';return;}
  var row=(res.data&&res.data[0])||rec;
  D.audit.unshift({_id:row.id,brand:rec.brand,handle:rec.handle,profile_url:rec.profile_url,platform:rec.platform,followers:rec.followers,avg_views:rec.avg_views,country:rec.country,owner:rec.owner,influencer_cost:rec.influencer_cost,review:'待审',notes:rec.notes,submit_date:rec.submit_date,reply_text:rec.reply_text||'',intent:rec.intent||'',intent_ai:'',lead_id:null,kk_note:'',sample_action:rec.sample_action,deliverables:rec.deliverables||'',created_at:''});
  ['rfHandle','rfUrl','rfFans','rfViews','rfCountry','rfCost','rfWhy','rfDeliv','rfReply'].forEach(function(id){var e=document.getElementById(id);if(e)e.value='';});
  msg.innerHTML='<b style="color:var(--ok)">✓ 已提交，进入主管待审</b>';
  toast('「'+rec.handle+'」已提报，进入主管待审');render();

function ldCsvQ(v){v=String(v==null?'':v);return /[",\n]/.test(v)?('"'+v.replace(/"/g,'""')+'"'):v;}
function ldCsv(rows){return rows.map(function(r){return r.map(ldCsvQ).join(',');}).join('\n');}
function ldDl(name,text){try{var b=new Blob(['﻿'+text],{type:'text/csv;charset=utf-8;'});var u=URL.createObjectURL(b);
 var a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();
 setTimeout(function(){URL.revokeObjectURL(u);a.remove();},800);}catch(e){toast('下载失败：'+e.message);}}

 ['','','','','','','']]));toast('模板已下载：必填 邮箱 + 平台（IG/TT/YTB）');}
function ldCsvParse(t){t=String(t||'').replace(/^﻿/,'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
 var rows=[],row=[],cur='',q=false;
 for(var i=0;i<t.length;i++){var c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
  else if(c==='"')q=true;
  else if(c===','||c==='\t'){row.push(cur);cur='';}
  else if(c==='\n'){row.push(cur);cur='';rows.push(row);row=[];}
  else cur+=c;}
 if(cur!==''||row.length){row.push(cur);rows.push(row);}
 return rows.filter(function(r){return r.some(function(x){return String(x).trim()!=='';});});}
function ldPlat(v){v=String(v||'').trim().toLowerCase();
 if(/^(ig|instagram|ins)$/.test(v))return 'IG';
 if(/^(tt|tiktok|tik tok)$/.test(v))return 'TT';
 if(/^(yt|ytb|youtube)$/.test(v))return 'YTB';
 return '';}
function ldMail2(v){v=String(v||'').trim();return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)?v:'';}
function ldBjNow(){return new Date(Date.now()+8*3600e3).toISOString().slice(0,16).replace('T',' ');}

window.loadRank2=async function(mo){ var m=(mo!==undefined&&mo!==null&&mo!=='')?mo:(rankMonth||(typeof beijingMonth==='function'?beijingMonth():null)); try{ var q=await sb.rpc('brand_leaderboard',{p_month:m}); if(q.error){ RANK2=[]; console.warn('rank rpc:',q.error.message);} else { RANK2=q.data||[]; } }catch(e){ RANK2=[]; } };
window.acTog=function(el){el.classList.toggle('on');};
window.mountAccounts=async function(){
 var root=document.getElementById('acc-root'); if(!root)return;
 if(PROFILES===null){ root.innerHTML='加载中…'; try{ var q=await sb.from('profiles').select('*'); if(q.error)throw q.error; PROFILES=q.data||[]; }catch(e){ root.innerHTML='<div class="m e" style="color:#c0392b">读取账号失败：'+(e.message||e)+'　（确认已执行 profiles_setup.sql，且你已被设为 admin）</div>'; return; } }
 if(!PROFILES.length){ root.innerHTML='<div class="sub">还没有账号，用上面的表单创建第一个。</div>'; return; }
 var ob=(typeof D!=='undefined'&&D.ownerBrands)||{}; var owners=Object.keys(ob).sort(); var allBrands=Object.keys((typeof D!=='undefined'&&D.brands)||{}).sort();
 var oopt=function(sel){return '<option value="">—</option>'+owners.map(function(o){return '<option value="'+o+'"'+(o===sel?' selected':'')+'>'+o+'</option>';}).join('');};
 var rows=PROFILES.map(function(pf){
  var isPromo=(pf.role==='promo'||pf.role==='promo_b');
  var selB=(pf.brands&&pf.brands.length)?pf.brands:(isPromo?(ob[pf.owner_name]||[]):[]);
  var roleSel='<select id="r_'+pf.id+'" class="inp" style="width:96px"><option value="promo"'+(pf.role==='promo'?' selected':'')+'>推广</option><option value="sup"'+(pf.role==='sup'?' selected':'')+'>主管</option><option value="ads"'+(pf.role==='ads'?' selected':'')+'>广告</option><option value="admin"'+(pf.role==='admin'?' selected':'')+'>管理员</option></select>';
  var ownerSel='<select id="o_'+pf.id+'" class="inp" style="width:150px">'+oopt(pf.owner_name||'')+'</select>';
  var brandCell=isPromo?('<div id="bb_'+pf.id+'" style="max-width:320px;display:flex;flex-wrap:wrap;gap:4px">'+allBrands.map(function(b){return '<span class="chip'+(selB.indexOf(b)>=0?' on':'')+'" data-b="'+b+'" onclick="acTog(this)">'+b+'</span>';}).join('')+'</div>'):'<span class="mut">全部</span>';
  var _dfc=(pf.role==='admin'||pf.role==='sup');var _cw=(pf.can_crawl==null?_dfc:!!pf.can_crawl);
  var caps='<label><input type="checkbox" id="ca_'+pf.id+'"'+(pf.can_audit?' checked':'')+'>审</label> <label><input type="checkbox" id="cs_'+pf.id+'"'+(pf.can_settle?' checked':'')+'>款</label> <label><input type="checkbox" id="cd_'+pf.id+'"'+(pf.can_ads?' checked':'')+'>告</label> <label title="可以改抓取配置、点立即运行一次"><input type="checkbox" id="cw_'+pf.id+'"'+(_cw?' checked':'')+'>抓</label>';
  return '<tr><td><b>'+(pf.name||'')+'</b><br><span class="mut" style="font-size:12px">'+(pf.email||'')+'</span></td><td>'+roleSel+'</td><td>'+ownerSel+'</td><td>'+brandCell+'</td><td>'+caps+'</td><td><button class="btn" onclick="window.acSave&&window.acSave(\''+pf.id+'\')">保存</button> <button class="btn" style="background:#fff;color:#c0392b;border:1px solid #eab" onclick="window.acDelete&&window.acDelete(\''+pf.id+'\',\''+(pf.email||'')+'\')">删除</button></td></tr>';
 }).join('');
 root.innerHTML='<div style="overflow:auto"><table><thead><tr><th>成员</th><th>角色</th><th>负责人</th><th>可见品牌（发货口径·自动）</th><th>权限<div class="mut" style="font-weight:400;font-size:11px">审=审核台 款=结算 告=广告 <b>抓=可抓取</b></div></th><th>操作</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
};
window.acCreate=async function(){
 var g=function(id){return document.getElementById(id);};
 var email=(g('ac_email').value||'').trim(), pw=g('ac_pw').value||'', name=(g('ac_name').value||'').trim(), role=g('ac_role').value, owner=g('ac_owner')?g('ac_owner').value:'', ca=g('ac_ca').checked, cs=g('ac_cs').checked, cd=g('ac_cd').checked;
 if(!email||!pw){ if(window.toast)window.toast('邮箱和初始密码必填'); return; }
 if(pw.length<6){ if(window.toast)window.toast('密码至少6位'); return; }
 var btn=g('ac_btn'); btn.disabled=true; btn.textContent='创建中…';
 try{
  var tmp=window.supabase.createClient(SB_URL,SB_KEY,{auth:{storageKey:'ac_tmp_'+Date.now(),persistSession:false,autoRefreshToken:false}});
  var r=await tmp.auth.signUp({email:email,password:pw});
  if(r.error) throw r.error;
  var uid=r.data&&r.data.user&&r.data.user.id;
  if(!uid) throw new Error('未拿到用户ID：请在 Supabase → Authentication → Email 关闭 “Confirm email” 后重试');
  var isPromo=(role==='promo'||role==='promo_b'); var brands=[]; document.querySelectorAll('#ac_brandbox .chip.on').forEach(function(c){brands.push(c.getAttribute('data-b'));}); var ownerName=(owner||'').trim()||name;
  var cw=(g('ac_cw')?g('ac_cw').checked:(role==='admin'||role==='sup'));
  var payload={id:uid,email:email,name:name,role:role,owner_name:(isPromo?ownerName:null),brands:(isPromo?brands:null),can_audit:ca,can_settle:cs,can_ads:cd,can_crawl:cw};
  var up=await sb.from('profiles').upsert(payload);
  if(up.error) throw up.error;
  var staffMsg='';
  if(isPromo&&ownerName){
   try{
    var stq=await sb.from('staff').select('id,name');
    var list=(stq&&stq.data)||[];
    var hit=list.filter(function(x){return ownNm(x.name)===ownNm(ownerName);})[0];
    if(!hit){
     var ins=await sb.from('staff').insert({name:ownerName,role:'推广',collab_count:0});
     if(ins.error){
      var mx=0;list.forEach(function(x){if(+x.id>mx)mx=+x.id;});
      ins=await sb.from('staff').insert({id:mx+1,name:ownerName,role:'推广',collab_count:0});
     }
     if(ins.error){staffMsg='（⚠️ 名单表没写进去：'+ins.error.message+'，他暂时不会出现在「归属人」下拉里）';}
     else{
      staffMsg='，已同时加入人员名单';
      if(D.personas&&D.personas.indexOf(ownerName)<0)D.personas.push(ownerName);
      window.__RAW=null;
     }
    }
   }catch(e){staffMsg='（⚠️ 名单表写入异常：'+((e&&e.message)||e)+'）';}
  }
  try{ await tmp.auth.signOut(); }catch(e){}
  if(window.toast)window.toast('✅ 账号已创建：'+email+staffMsg);
  g('ac_email').value='';g('ac_pw').value='';g('ac_name').value='';
  PROFILES=null; await window.mountAccounts();
 }catch(e){ if(window.toast)window.toast('创建失败：'+(e.message||e)); }
 btn.disabled=false; btn.textContent='创建账号';
};
window.acSave=async function(uid){
 var g=function(id){return document.getElementById(id);};
 var role=g('r_'+uid).value, owner=g('o_'+uid)?g('o_'+uid).value:null, ca=g('ca_'+uid).checked, cs=g('cs_'+uid).checked, cd=g('cd_'+uid).checked, cw=(g('cw_'+uid)?g('cw_'+uid).checked:false); var brands=[]; var box=document.getElementById('bb_'+uid); if(box)box.querySelectorAll('.chip.on').forEach(function(c){brands.push(c.getAttribute('data-b'));});
 try{ var up=await sb.from('profiles').update({role:role,owner_name:((role==='promo'||role==='promo_b')?owner:null),brands:((role==='promo'||role==='promo_b')?brands:null),can_audit:ca,can_settle:cs,can_ads:cd,can_crawl:cw}).eq('id',uid); if(up.error) throw up.error; if(window.toast)window.toast('已保存'); PROFILES=null; await window.mountAccounts(); }
 catch(e){ if(window.toast)window.toast('保存失败：'+(e.message||e)); }
};
window.acDelete=async function(uid,email){
 if(!window.confirm('删除 '+email+' 的权限行？（登录账号本身需到 Supabase 后台删除）')) return;
 try{ var q=await sb.from('profiles').delete().eq('id',uid); if(q.error) throw q.error; if(window.toast)window.toast('已删除权限行'); PROFILES=null; await window.mountAccounts(); }
 catch(e){ if(window.toast)window.toast('删除失败：'+(e.message||e)); }
};
async function loadMe(){ let user=null; try{const r=await sb.auth.getUser(); user=r&&r.data&&r.data.user;}catch(e){} window.__me=user;
 let prof=null, tableMissing=false;
 if(user){ try{ const q=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle(); if(q.error){ if(/relation|does not exist|not exist|find the table|schema cache/i.test(q.error.message||''))tableMissing=true; } else prof=q.data; }catch(e){ tableMissing=true; }
  if(!prof&&!tableMissing){ try{ const q2=await sb.from('profiles').select('*').eq('email',user.email).maybeSingle(); prof=q2.data; }catch(e){} } }
 if(prof){ __myprof=prof; realRole=prof.role||'promo'; role=realRole; meOwner=prof.owner_name||prof.name||''; if(prof.can_audit!=null||prof.can_settle!=null||prof.can_ads!=null||prof.can_crawl!=null){ __capOverride={audit:!!prof.can_audit,settle:!!prof.can_settle,ads:!!prof.can_ads,crawl:(prof.can_crawl==null?null:!!prof.can_crawl)}; } else { __capOverride=null; } }
 else if(tableMissing){ __myprof=null; realRole='admin'; role='admin'; meOwner=''; __capOverride=null; }
 else { __myprof=null; realRole='promo'; role='promo'; meOwner=(user&&user.email)||''; __capOverride={audit:false,settle:false,ads:false,crawl:false}; }
}
async function boot(){
 try{ if(window.toast)toast('正在从真库加载数据…'); try{await loadMe();}catch(e){console.warn('loadMe',e);} if(typeof setMyBrands==='function')setMyBrands(); if(typeof setCaps==='function')setCaps(); await loadReal(); if(window.loadRank2)await window.loadRank2(); const lo=document.getElementById('lo'); if(lo)lo.remove(); if(window.render)render(); if(window.toast)toast('✅ 已加载真实数据'); }
 catch(e){ const lo=document.getElementById('lo'); if(lo){document.getElementById('lmsg').innerHTML='<div class="m e">加载失败：'+(e.message||e)+'</div>';const b=document.getElementById('lbtn');if(b){b.disabled=false;b.textContent='重试';}} else alert('加载失败：'+(e.message||e)); }
}
// 启动：有会话直接进，否则登录
(function(){
 var h=String(location.hash||'');
 var isRecovery=(h.indexOf('type=recovery')>=0);
 if(h.indexOf('error')>=0&&h.indexOf('otp_expired')>=0){
  css();var d=document.createElement('div');d.id='lo';
  d.innerHTML='<div class="box"><h2>链接已失效</h2><div class="s">重置链接有时效，且只能用一次</div><div class="m e" style="margin-bottom:14px">请回到登录页重新点「忘记密码？」获取新链接。</div><button id="lbtn2">回到登录</button></div>';
  document.body.appendChild(d);
  document.getElementById('lbtn2').onclick=function(){location.replace(location.origin+location.pathname);};
  return;
 }
 if(isRecovery){ sb.auth.onAuthStateChange(function(ev){ if(ev==='PASSWORD_RECOVERY'||ev==='SIGNED_IN'){ if(!document.getElementById('lo'))showReset(); } });
  setTimeout(function(){ if(!document.getElementById('lo'))showReset(); },1200); return; }
 sb.auth.getSession().then(({data})=>{ if(data&&data.session){boot();} else {showLogin();} });
})();
})();
